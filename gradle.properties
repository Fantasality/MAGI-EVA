# MAGI-EVA
#
# 本工程没有任何 AndroidX 依赖，但仍然显式声明 useAndroidX，
# 免得 AGP 在别处（例如 lint 规则、test 基础设施）默认拉进 support 库。
android.useAndroidX=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 如果构建机需要走代理拉依赖，取消下面两行注释并改成自己的端口。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897

# 本工程的 app/src/main/AndroidManifest.xml 刻意不写 package="…"
# （AGP 8 起该属性被移除，改用下面的 namespace）。
# 但仓库根目录的 build.sh（免 Gradle 直构）需要包名，它会在构建目录里
# 生成一份注入了 package 的 manifest 副本，源文件始终保持干净。
